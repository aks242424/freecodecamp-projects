<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Feedback Survey</title>
</head>
<body>

  <h1 id="title">Developer Experience Survey</h1>
  <p id="description">Help us tailor better learning tools and resources for your coding journey.</p>

  <form id="survey-form">
    
    <div>
      <label id="name-label" for="name">Name:</label>
      <input 
        type="text" 
        id="name" 
        placeholder="Enter your full name" 
        required 
      />
    </div>

    <div>
      <label id="email-label" for="email">Email:</label>
      <input 
        type="email" 
        id="email" 
        placeholder="Enter your email address" 
        required 
      />
    </div>

    <div>
      <label id="number-label" for="number">Years of Experience (optional):</label>
      <input 
        type="number" 
        id="number" 
        min="0" 
        max="50" 
        placeholder="Years" 
      />
    </div>

    <div>
      <label for="dropdown">Which role best describes you?</label>
      <select id="dropdown">
        <option value="" disabled selected>Select current role</option>
        <option value="student">Student</option>
        <option value="full-time">Full-Time Developer</option>
        <option value="freelancer">Freelancer</option>
        <option value="hobbyist">Hobbyist</option>
      </select>
    </div>

    <div>
      <p>Would you recommend our learning path to a colleague?</p>
      <input 
        type="radio" 
        id="definitely" 
        name="recommendation" 
        value="definitely" 
        checked 
      />
      <label for="definitely">Definitely</label><br />

      <input 
        type="radio" 
        id="maybe" 
        name="recommendation" 
        value="maybe" 
      />
      <label for="maybe">Maybe</label><br />

      <input 
        type="radio" 
        id="not-sure" 
        name="recommendation" 
        value="not-sure" 
      />
      <label for="not-sure">Not Sure</label>
    </div>

    <div>
      <p>What topics are you interested in mastering next? (Check all that apply)</p>
      <input 
        type="checkbox" 
        id="frontend" 
        name="topics" 
        value="frontend" 
      />
      <label for="frontend">Frontend Architecture</label><br />

      <input 
        type="checkbox" 
        id="backend" 
        name="topics" 
        value="backend" 
      />
      <label for="backend">Backend & Databases</label><br />

      <input 
        type="checkbox" 
        id="devops" 
        name="topics" 
        value="devops" 
      />
      <label for="devops">DevOps & Cloud</label><br />

      <input 
        type="checkbox" 
        id="ai-ml" 
        name="topics" 
        value="ai-ml" 
      />
      <label for="ai-ml">Artificial Intelligence & ML</label>
    </div>

    <div>
      <label for="comments">Any additional comments or suggestions?</label><br />
      <textarea 
        id="comments" 
        name="comments" 
        placeholder="Enter your comments here..."
      ></textarea>
    </div>

    <button type="submit" id="submit">Submit</button>

  </form>

</body>
</html>
